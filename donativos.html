<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mozzafiato · Donativos (Admin)</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#3a3020">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="donativos.css">
  <style>
    .gate{max-width:380px; margin:50px auto; text-align:center; padding:28px 24px}
    .gate img{width:210px; max-width:70%}
    .gate h2{margin:14px 0 4px}
    .gate p{color:var(--text-soft); font-size:.85rem; margin:0 0 16px}
    .gate .campo{text-align:left}
    .err{color:var(--danger); font-size:.88rem; min-height:1.3em; margin-top:8px}

    .tabs{display:flex; gap:4px; padding:0 12px; background:var(--footer-bg); overflow-x:auto}
    .tabs button{background:none; border:none; color:var(--footer-text); opacity:.65; padding:10px 14px 12px; font-size:.9rem; border-bottom:3px solid transparent; white-space:nowrap}
    .tabs button.on{opacity:1; border-bottom-color:var(--gold-light); color:#fff}
    main{max-width:1100px; margin:0 auto; padding:18px 16px 80px}

    .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px}
    .toolbar input,.toolbar select{flex:1; min-width:180px; padding:11px 14px; border:1px solid var(--line); border-radius:999px; background:var(--white); outline:none}
    .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px}
    .kpi{padding:12px 14px}
    .kpi .n{font-family:var(--display); font-size:1.5rem; font-weight:700; color:var(--gold-dark)}
    .kpi .l{font-size:.72rem; color:var(--text-soft); letter-spacing:.05em}

    .sols{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px}
    .sol{padding:14px 16px; cursor:pointer; transition:transform .1s, box-shadow .1s}
    .sol:hover{transform:translateY(-1px); box-shadow:0 12px 30px rgba(58,48,32,.14)}
    .sol h3{font-size:1.08rem}
    .sol .ev{font-size:.82rem; color:var(--text-soft); margin-top:3px}
    .sol .nums{display:flex; gap:12px; flex-wrap:wrap; margin-top:10px; font-size:.8rem; color:var(--text-soft)}
    .sol .nums b{color:var(--text)}
    .barrita{height:6px; background:var(--bg2); border-radius:6px; margin-top:10px; overflow:hidden}
    .barrita i{display:block; height:100%; background:var(--gold)}

    /* Paneles (detalle / editor) */
    .velo{position:fixed; inset:0; background:rgba(30,24,14,.45); z-index:40; display:flex; justify-content:center; align-items:flex-start; overflow-y:auto; padding:24px 12px}
    .panel{width:100%; max-width:820px; background:var(--bg); border-radius:18px; box-shadow:0 30px 80px rgba(0,0,0,.35); overflow:hidden}
    .panel > .ph{display:flex; align-items:center; gap:10px; padding:14px 18px; background:var(--footer-bg); color:var(--footer-text)}
    .panel > .ph h2{color:#fff; flex:1; font-size:1.15rem; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
    .panel > .ph .x{background:none; border:none; color:var(--footer-text); font-size:1.6rem; line-height:1; padding:0 4px}
    .panel > .pb{padding:18px}
    .seccion{margin-bottom:18px}
    .seccion > h3{font-size:1rem; margin-bottom:10px}
    .grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 12px}
    @media (max-width:640px){ .grid2{grid-template-columns:1fr} }

    .linkbox{padding:14px 16px; display:flex; flex-direction:column; gap:10px}
    .linkbox code{font-size:.78rem; word-break:break-all; color:var(--text-soft); background:var(--bg); padding:8px 10px; border-radius:8px}
    .linkbox .btns{display:flex; gap:8px; flex-wrap:wrap}

    table.t{width:100%; border-collapse:collapse; font-size:.85rem}
    table.t th{text-align:left; font-weight:normal; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--text-soft); padding:8px; border-bottom:1px solid var(--line)}
    table.t td{padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top}
    table.t td.num,table.t th.num{text-align:right; white-space:nowrap}
    table.t tr.total td{font-weight:700; border-bottom:none}
    .tabla{overflow-x:auto}
    .folio{font-family:var(--display); font-weight:700; color:var(--gold-dark); white-space:nowrap}
    .peq{font-size:.78rem; color:var(--text-soft)}

    /* Editor de cupones */
    .cup-ed{padding:14px; margin-bottom:12px; position:relative}
    .cup-ed .cab{display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap}
    .cup-ed .cab .num{font-family:var(--display); font-weight:700; color:var(--gold-dark)}
    .cup-ed .cab .sp{flex:1}
    .seg{display:inline-flex; border:1px solid var(--gold-dark); border-radius:999px; overflow:hidden}
    .seg button{border:none; background:transparent; color:var(--gold-dark); padding:7px 14px; font-size:.82rem}
    .seg button.on{background:var(--gold-dark); color:var(--footer-text)}
    .items{margin:8px 0}
    .it{display:grid; grid-template-columns:1fr 64px 90px 32px; gap:6px; align-items:center; margin-bottom:6px}
    .it input{padding:8px 9px; border:1px solid var(--line); border-radius:8px; background:var(--white); width:100%; min-width:0; outline:none}
    .it .q{border:none; background:none; color:var(--danger); font-size:1.2rem}
    .it-h{display:grid; grid-template-columns:1fr 64px 90px 32px; gap:6px; font-size:.68rem; color:var(--text-soft); text-transform:uppercase; letter-spacing:.05em}
    .buscador{position:relative}
    .buscador input{width:100%; padding:10px 12px; border:1px dashed var(--gold); border-radius:10px; background:var(--white); outline:none}
    .sug{position:absolute; left:0; right:0; top:100%; z-index:5; background:var(--white); border:1px solid var(--line); border-radius:10px; box-shadow:0 14px 30px rgba(58,48,32,.18); max-height:260px; overflow-y:auto}
    .sug div{padding:9px 12px; cursor:pointer; display:flex; justify-content:space-between; gap:10px; font-size:.88rem}
    .sug div:hover,.sug div.sel{background:var(--bg)}
    .sug small{color:var(--text-soft)}
    .valor{font-size:.82rem; color:var(--text-soft); text-align:right; margin-top:4px}
    .bloqueado{opacity:.85}
    .bloqueado .aviso{font-size:.82rem; color:var(--gold-dark); background:var(--bg2); padding:8px 10px; border-radius:8px; margin-bottom:8px}
    .pie-panel{position:sticky; bottom:0; display:flex; gap:10px; justify-content:flex-end; padding:12px 18px; background:var(--bg); border-top:1px solid var(--line); flex-wrap:wrap}
    .qrcaja{width:220px; height:220px; margin:10px auto; background:#fff; padding:8px; border:1px solid var(--line)}
    .qrcaja svg{width:100%; height:100%}
  </style>
</head>
<body>
  <!-- Login -->
  <div class="card gate" id="gate" hidden>
    <img data-logo="#5e4f30" alt="Mozzafiato">
    <h2>Donativos</h2>
    <p>Cupones de regalo para escuelas e instituciones</p>
    <label class="campo"><span>Correo</span><input id="email" type="email" autocomplete="username"></label>
    <label class="campo"><span>Contraseña</span><input id="pass" type="password" autocomplete="current-password"></label>
    <button class="btn grande" id="entrar">Entrar</button>
    <div class="err" id="gate-err"></div>
  </div>

  <div id="app" hidden>
    <div class="barra">
      <img data-logo="#d4c49a" alt="">
      <div class="tit"><div class="t">Mozzafiato</div><div class="s">Donativos · Admin</div></div>
      <button class="btn chico sec" id="salir" style="color:var(--footer-text);border-color:rgba(212,196,154,.4)">Salir</button>
    </div>
    <div class="tabs">
      <button data-tab="solicitudes" class="on">Solicitudes</button>
      <button data-tab="reporte">Reporte</button>
      <button data-tab="caja">Caja</button>
    </div>
    <main id="vista"><div class="cargando">Cargando…</div></main>
  </div>
  <div id="capa"></div>

<script src="vendor/qrcode.js"></script>
<script src="donativos-comun.js"></script>
<script src="cotizador-data.js"></script>
<script>
(function(){
  'use strict';
  var E = DON.esc;
  var $ = function(id){ return document.getElementById(id); };
  var lista = [];          // solicitudes con cupones
  var tab = 'solicitudes';
  var filtro = '';
  var anioRep = String(new Date().getFullYear());
  var CATALOGO = (typeof COTIZADOR_MENU !== 'undefined' ? COTIZADOR_MENU : []).map(function(p){
    return { nombre: p.name, cat: p.cat, precio: Number(p.price) || 0, k: quitarAcentos(p.name + ' ' + p.cat) };
  });
  // Artículos que se arman por pasos (pastas, lattes, frappés…), del cotizador
  (typeof COTIZADOR_COMBOS !== 'undefined' ? COTIZADOR_COMBOS : []).forEach(function(c){
    var corto = String(c.label || c.id).split(' (')[0];
    var opciones = c.groups.map(function(g){ return g.options.map(function(o){ return o.n; }).join(' '); }).join(' ');
    CATALOGO.unshift({ combo: c, nombre: corto, cat: c.cat, precio: Number(c.from) || 0,
                       k: quitarAcentos(corto + ' ' + c.cat + ' ' + c.label + ' ' + opciones) });
  });
  var A_ELEGIR = '__elegir__';

  function quitarAcentos(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

  // ═════════ Sesión ═════════
  async function entrar(){
    var b = $('entrar'); b.disabled = true; $('gate-err').textContent = '';
    try {
      await DON.login($('email').value.trim(), $('pass').value);
      await validarAdmin();
    } catch (e) { $('gate-err').textContent = DON.textoError(e); }
    b.disabled = false;
  }
  async function validarAdmin(){
    var ok = await DON.rpc('don_es_admin', {}, true);
    if (!ok) { DON.logout(); mostrarGate('Tu cuenta entró, pero no está dada de alta como admin de Donativos (corre donativos_02_admin.sql).'); return; }
    $('gate').hidden = true; $('app').hidden = false;
    await recargar();
  }
  function mostrarGate(msg){
    $('app').hidden = true; $('gate').hidden = false; $('gate-err').textContent = msg || '';
    var s = DON.getSesion(); if (s && s.email) $('email').value = s.email;
  }
  $('entrar').onclick = entrar;
  $('pass').addEventListener('keydown', function(e){ if (e.key === 'Enter') entrar(); });
  $('salir').onclick = function(){ DON.logout(); lista = []; mostrarGate(); };

  async function llamar(fn, args){
    try { return await DON.rpc(fn, args, true); }
    catch (e) {
      if (/SIN_SESION|JWT/.test(e.message)) { DON.logout(); mostrarGate('Tu sesión expiró. Vuelve a entrar.'); }
      throw e;
    }
  }
  async function recargar(){
    try { lista = await llamar('don_listar', {}) || []; }
    catch (e) { DON.toast(DON.textoError(e), true); }
    pintar();
  }

  // ═════════ Tabs ═════════
  document.querySelector('.tabs').addEventListener('click', function(e){
    var b = e.target.closest('[data-tab]'); if (!b) return;
    tab = b.getAttribute('data-tab');
    document.querySelectorAll('.tabs button').forEach(function(x){ x.classList.toggle('on', x === b); });
    pintar();
  });
  function pintar(){
    if (tab === 'solicitudes') pintarSolicitudes();
    else if (tab === 'reporte') pintarReporte();
    else pintarCaja();
  }

  // ═════════ Utilidades de datos ═════════
  function resumen(s){
    var cs = s.cupones || [], r = { total: 0, valor: 0, canj: 0, valorCanj: 0, vig: 0, venc: 0, canc: 0 };
    cs.forEach(function(c){
      var est = DON.estadoCupon(c).clave;
      if (est === 'cancelado') { r.canc++; return; }
      r.total++; r.valor += Number(c.valor) || 0;
      if (est === 'canjeado') { r.canj++; r.valorCanj += Number(c.valor) || 0; }
      else if (est === 'vencido') r.venc++;
      else r.vig++;
    });
    return r;
  }
  function buscarSol(id){ return lista.filter(function(s){ return s.id === id; })[0]; }

  // ═════════ SOLICITUDES ═════════
  function pintarSolicitudes(){
    var tot = { s: lista.length, c: 0, v: 0, cj: 0 };
    lista.forEach(function(s){ var r = resumen(s); tot.c += r.total; tot.v += r.valor; tot.cj += r.canj; });
    var f = quitarAcentos(filtro);
    var vis = lista.filter(function(s){
      return !f || quitarAcentos([s.institucion, s.evento, s.contacto, (s.cupones||[]).map(function(c){ return c.folio + ' ' + (c.ganador_nombre||''); }).join(' ')].join(' ')).indexOf(f) !== -1;
    });
    var h = '<div class="kpis">' +
      kpi(tot.s, 'Solicitudes') + kpi(tot.c, 'Cupones donados') + kpi(tot.cj, 'Canjeados') + kpi(DON.dinero(tot.v), 'Valor donado') +
    '</div>' +
    '<div class="toolbar"><input id="filtro" placeholder="Buscar institución, evento, folio o beneficiario…" value="' + E(filtro) + '">' +
    '<button class="btn" id="nueva">+ Nueva solicitud</button></div>';
    if (!lista.length) h += '<div class="card vacio">Aún no hay solicitudes. Cuando una escuela o institución te pida apoyo, regístrala aquí con <b>+ Nueva solicitud</b>.</div>';
    else if (!vis.length) h += '<div class="vacio">Nada coincide con la búsqueda.</div>';
    h += '<div class="sols">' + vis.map(function(s){
      var r = resumen(s), pct = r.total ? Math.round(r.canj / r.total * 100) : 0;
      return '<div class="card sol" data-id="' + s.id + '">' +
        '<h3>' + E(s.institucion) + '</h3>' +
        '<div class="ev">' + E(s.evento || 'Sin evento') + (s.fecha_evento ? ' · ' + E(DON.fechaCorta(s.fecha_evento)) : '') + '</div>' +
        '<div class="nums"><span><b>' + r.total + '</b> cupones</span><span><b>' + r.canj + '</b> canjeados</span>' +
          (r.venc ? '<span style="color:var(--danger)"><b>' + r.venc + '</b> vencidos</span>' : '') +
          '<span><b>' + DON.dinero(r.valor) + '</b></span></div>' +
        '<div class="barrita"><i style="width:' + pct + '%"></i></div>' +
      '</div>';
    }).join('') + '</div>';
    $('vista').innerHTML = h;
    var fi = $('filtro');
    fi.oninput = function(){ filtro = fi.value; var pos = fi.selectionStart; pintarSolicitudes(); var n = $('filtro'); n.focus(); n.setSelectionRange(pos, pos); };
    $('nueva').onclick = function(){ abrirEditor(null); };
    $('vista').querySelectorAll('.sol').forEach(function(el){ el.onclick = function(){ abrirDetalle(el.getAttribute('data-id')); }; });
  }
  function kpi(n, l){ return '<div class="card kpi"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>'; }

  // ═════════ Panel genérico ═════════
  function abrirPanel(titulo, cuerpo, pie){
    $('capa').innerHTML = '<div class="velo"><div class="panel">' +
      '<div class="ph"><h2>' + E(titulo) + '</h2><button class="x" data-cerrar>×</button></div>' +
      '<div class="pb">' + cuerpo + '</div>' + (pie ? '<div class="pie-panel">' + pie + '</div>' : '') +
    '</div></div>';
    document.body.style.overflow = 'hidden';
    $('capa').querySelector('[data-cerrar]').onclick = cerrarPanel;
    return $('capa').querySelector('.panel');
  }
  function cerrarPanel(){ $('capa').innerHTML = ''; document.body.style.overflow = ''; }

  // ═════════ DETALLE de una solicitud ═════════
  function mensajeInstitucion(s){
    var r = resumen(s);
    return 'Hola' + (s.contacto ? ' ' + s.contacto : '') + ' 👋\n' +
      'Con mucho gusto Mozzafiato apoya ' + DON.eventoFrase(s.evento) + ' ☕\n\n' +
      'Aquí están los ' + r.total + ' cupón(es) de regalo:\n' + DON.urlInstitucion(s.token) + '\n\n' +
      'Desde ese enlace pueden enviarle a cada persona su cupón por WhatsApp o imprimirlos. ' +
      'Quien lo recibe lo presenta en caja y se canjea una sola vez, solo para consumir en el restaurante (no aplica para llevar). ' +
      'Las condiciones completas vienen en cada cupón.\n¡Mucho éxito!';
  }

  function abrirDetalle(id){
    var s = buscarSol(id); if (!s) return;
    var r = resumen(s), link = DON.urlInstitucion(s.token);
    var filas = (s.cupones || []).map(function(c){
      var est = DON.estadoCupon(c);
      return '<tr>' +
        '<td><div class="folio">' + E(c.folio) + '</div><div class="peq">' + E(c.titulo) + '</div></td>' +
        '<td>' + DON.lineasCupon(c).map(E).join('<br>') + (DON.vigenciaTexto(c) ? '<div class="peq">' + E(DON.vigenciaTexto(c)) + '</div>' : '') + '</td>' +
        '<td class="num">' + DON.dinero(c.valor) + '</td>' +
        '<td><span class="chip ' + est.clave + '">' + est.texto + '</span>' +
          (c.estado === 'canjeado' ? '<div class="peq" style="margin-top:4px">' + E(c.ganador_nombre || '') + '<br>' +
            (c.ganador_tel ? '<a href="' + DON.waLink(c.ganador_tel, '') + '" target="_blank">' + E(c.ganador_tel) + '</a><br>' : '') +
            E(DON.fechaHora(c.canjeado_en)) + (c.canje_notas ? '<br><i>' + E(c.canje_notas) + '</i>' : '') + '</div>' : '') +
        '</td>' +
        '<td class="num">' +
          '<button class="btn chico sec" data-img="' + E(c.folio) + '">Imagen</button>' +
          (c.estado === 'canjeado' ? '<br><button class="btn chico peligro" style="margin-top:6px" data-deshacer="' + E(c.folio) + '">Deshacer canje</button>' : '') +
        '</td></tr>';
    }).join('');
    var cuerpo =
      '<div class="seccion peq">' +
        (s.evento ? E(s.evento) : 'Sin evento') + (s.fecha_evento ? ' · ' + E(DON.fecha(s.fecha_evento)) : '') +
        (s.contacto || s.telefono ? '<br>Contacto: ' + E(s.contacto || '') + (s.telefono ? ' · ' + E(s.telefono) : '') : '') +
        (s.motivo ? '<br>Motivo: ' + E(s.motivo) : '') +
        (s.notas ? '<br>Notas: ' + E(s.notas) : '') +
        '<br>Registrada el ' + E(DON.fechaHora(s.creado)) +
      '</div>' +
      '<div class="kpis">' + kpi(r.total, 'Cupones') + kpi(r.canj, 'Canjeados') + kpi(r.vig, 'Vigentes') + kpi(DON.dinero(r.valor), 'Valor') + '</div>' +
      '<div class="seccion"><h3>Link para la institución</h3><div class="card linkbox">' +
        '<code>' + E(link) + '</code>' +
        '<div class="btns">' +
          (s.telefono ? '<a class="btn wa" target="_blank" href="' + E(DON.waLink(s.telefono, mensajeInstitucion(s))) + '">Enviar por WhatsApp</a>'
                      : '<a class="btn wa" target="_blank" href="https://wa.me/?text=' + encodeURIComponent(mensajeInstitucion(s)) + '">Enviar por WhatsApp</a>') +
          '<button class="btn sec" id="copiar-link">Copiar link</button>' +
          '<a class="btn sec" target="_blank" href="' + E(link) + '">Ver página</a>' +
        '</div>' +
        '<div class="peq">Es un link secreto: solo quien lo tenga ve estos cupones.</div>' +
      '</div></div>' +
      '<div class="seccion"><h3>Cupones</h3><div class="card tabla"><table class="t">' +
        '<tr><th>Folio</th><th>Incluye</th><th class="num">Valor</th><th>Estado</th><th></th></tr>' + filas +
      '</table></div></div>';
    var pie = '<button class="btn peligro" id="borrar">Borrar solicitud</button><span style="flex:1"></span>' +
              '<button class="btn" id="editar">Editar / agregar cupones</button>';
    var p = abrirPanel(s.institucion, cuerpo, pie);
    $('copiar-link').onclick = function(){ DON.copiar(link); };
    $('editar').onclick = function(){ abrirEditor(s); };
    $('borrar').onclick = async function(){
      var n = (s.cupones || []).length;
      if (!confirm('¿Borrar la solicitud de "' + s.institucion + '" y sus ' + n + ' cupones?\n\nEl link de la institución y los cupones dejarán de funcionar. No se puede deshacer.')) return;
      if (r.canj && !confirm('Ojo: ' + r.canj + ' cupón(es) ya fueron CANJEADOS. Si la borras, esos canjes y sus ganadores también desaparecen del reporte.\n\n¿Borrar de todas formas?')) return;
      try { await llamar('don_borrar_solicitud', { p_id: s.id, p_forzar: r.canj > 0 }); cerrarPanel(); DON.toast('Solicitud borrada'); await recargar(); }
      catch (e) { DON.toast(DON.textoError(e), true); }
    };
    p.querySelectorAll('[data-img]').forEach(function(b){
      b.onclick = async function(){
        var c = (s.cupones || []).filter(function(x){ return x.folio === b.getAttribute('data-img'); })[0];
        b.disabled = true; try { await DON.descargarCupon(c, s); } catch (e) { DON.toast('No se pudo generar', true); } b.disabled = false;
      };
    });
    p.querySelectorAll('[data-deshacer]').forEach(function(b){
      b.onclick = async function(){
        var f = b.getAttribute('data-deshacer');
        if (!confirm('¿Deshacer el canje de ' + f + '? Volverá a estar vigente y se borra el beneficiario registrado.')) return;
        try { await llamar('don_deshacer_canje', { p_folio: f }); await recargar(); abrirDetalle(s.id); DON.toast('Canje deshecho'); }
        catch (e) { DON.toast(DON.textoError(e), true); }
      };
    });
  }

  // ═════════ EDITOR ═════════
  var ed = null; // copia editable

  function cuponVacio(n, plantilla){
    var base = plantilla || {};
    var c = { tipo: base.tipo || 'producto', titulo: 'Premio ' + n,
             items: (base.items || []).map(function(i){ return { nombre: i.nombre, cant: i.cant, precio: i.precio }; }),
             monto: base.monto || '', condiciones: base.condiciones != null ? base.condiciones : DON.CONDICIONES_DEFAULT,
             vence: base.vence || '', valido_desde: base.valido_desde || '', _auto: !base.vence || base._auto };
    ajustarVence(c);
    return c;
  }
  // ── Vigencia (ambas fechas cuentan completas):
  //    · "Válido hasta" se llena solo con el día siguiente al inicio ("Válido desde" o fecha del evento)
  //    · se puede elegir el MISMO día del inicio para que valga un solo día; nunca antes ──
  function sumarDias(iso, n){
    var d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function desdeEf(c){ return c.valido_desde || (ed && ed.fecha_evento) || ''; }
  function minVence(c){ return desdeEf(c); }                       // mínimo: el mismo día de inicio
  function venceSugerido(c){ var d = desdeEf(c); return d ? sumarDias(d, 1) : ''; } // por defecto: día siguiente
  // Si el "hasta" se llenó solo (o quedó antes del mínimo), se pone al día siguiente del inicio
  function ajustarVence(c){
    if (c.estado === 'canjeado') return;
    var m = minVence(c);
    if (c._auto || !c.vence) { c.vence = venceSugerido(c); c._auto = true; }
    else if (m && c.vence < m) { c.vence = venceSugerido(c); }
  }

  function abrirEditor(s){
    ed = s ? JSON.parse(JSON.stringify(s)) : { institucion: '', contacto: '', telefono: '', motivo: '', evento: '', fecha_evento: '', notas: '', cupones: [] };
    ed.cupones = (ed.cupones || []).map(function(c){
      return { id: c.id, folio: c.folio, estado: c.estado, vencido: c.vencido, ganador_nombre: c.ganador_nombre,
               tipo: c.tipo, titulo: c.titulo, items: c.items || [], monto: c.monto || '', condiciones: DON.notaExtra(c),
               vence: c.vence || '', valido_desde: c.valido_desde || '', cancelar: c.estado === 'cancelado' };
    });
    if (!ed.cupones.length) ed.cupones.push(cuponVacio(1));
    pintarEditor();
  }

  function campo(lbl, key, tipo, ph){
    return '<label class="campo"><span>' + lbl + '</span><input data-f="' + key + '" type="' + (tipo || 'text') + '" value="' + E(ed[key] || '') + '"' + (ph ? ' placeholder="' + E(ph) + '"' : '') + '></label>';
  }

  function valorCupon(c){
    if (c.tipo === 'monto') return Number(c.monto) || 0;
    return (c.items || []).reduce(function(a, i){ return a + (Number(i.cant) || 1) * (Number(i.precio) || 0); }, 0);
  }

  function htmlCupon(c, i){
    var lock = c.estado === 'canjeado';
    var h = '<div class="card cup-ed' + (lock ? ' bloqueado' : '') + '" data-i="' + i + '">' +
      '<div class="cab"><span class="num">' + (c.folio ? E(c.folio) : 'Nuevo') + '</span>' +
      (c.folio ? '<span class="chip ' + (c.cancelar ? 'cancelado' : DON.estadoCupon(c).clave) + '">' + (c.cancelar ? 'Cancelado' : DON.estadoCupon(c).texto) + '</span>' : '') +
      '<span class="sp"></span>';
    if (lock) {
      h += '</div><div class="aviso">Ya fue canjeado' + (c.ganador_nombre ? ' por ' + E(c.ganador_nombre) : '') + '. No se puede modificar.</div>' +
        '<div><b>' + E(c.titulo) + '</b> — ' + DON.lineasCupon(c).map(E).join(', ') + '</div></div>';
      return h;
    }
    h += '<div class="seg"><button data-tipo="producto" class="' + (c.tipo === 'producto' ? 'on' : '') + '">Productos</button>' +
         '<button data-tipo="monto" class="' + (c.tipo === 'monto' ? 'on' : '') + '">Monto $</button></div>' +
         '<button class="btn chico sec" data-dup title="Crear otro igual">+ Igual</button>' +
         (c.folio ? '<button class="btn chico ' + (c.cancelar ? 'sec' : 'peligro') + '" data-cancelar>' + (c.cancelar ? 'Reactivar' : 'Cancelar') + '</button>'
                  : '<button class="btn chico peligro" data-quitar>Quitar</button>') +
      '</div>' +
      '<label class="campo"><span>Nombre del premio</span><input data-c="titulo" value="' + E(c.titulo) + '" placeholder="Premio 1"></label>' +
      '<div class="grid2">' +
        '<label class="campo"><span>Válido desde</span><input data-c="valido_desde" type="date" value="' + E(c.valido_desde) + '"></label>' +
        '<label class="campo"><span>Válido hasta</span><input data-c="vence" type="date" value="' + E(c.vence) + '"' + (minVence(c) ? ' min="' + minVence(c) + '"' : '') + '></label>' +
      '</div>' +
      (c.vence && desdeEf(c) && c.vence === desdeEf(c) ? '<div class="peq" style="margin:-6px 0 10px;color:var(--gold-dark)">Vale <b>un solo día</b>: el ' + E(DON.fecha(c.vence)) + '.</div>' : '') +
      (c.valido_desde ? '' : '<div class="peq" style="margin:-6px 0 10px">Sin "Válido desde", cuenta la <b>fecha del evento</b>' + (ed.fecha_evento ? ' (' + E(DON.fechaCorta(ed.fecha_evento)) + ')' : '') + ': antes no se puede canjear.</div>');
    if (c.tipo === 'monto') {
      h += '<label class="campo"><span>Monto de consumo (una sola visita)</span><input data-c="monto" type="number" inputmode="decimal" min="1" step="1" value="' + E(c.monto) + '" placeholder="500"></label>';
    } else {
      h += '<div class="items">' + (c.items.length ? '<div class="it-h"><span>Producto</span><span>Cant.</span><span>Precio c/u</span><span></span></div>' : '') +
        c.items.map(function(it, j){
          return '<div class="it" data-j="' + j + '">' +
            '<input data-it="nombre" value="' + E(it.nombre) + '">' +
            '<input data-it="cant" type="number" inputmode="numeric" min="1" value="' + E(it.cant) + '">' +
            '<input data-it="precio" type="number" inputmode="decimal" min="0" value="' + E(it.precio) + '">' +
            '<button class="q" data-qit title="Quitar">×</button></div>';
        }).join('') + '</div>' +
        '<div class="buscador"><input data-buscar placeholder="＋ Agregar producto del menú (escribe para buscar)…" autocomplete="off"><div class="sug" hidden></div></div>';
    }
    h += '<label class="campo" style="margin-top:10px"><span>Nota adicional en el cupón (opcional)</span><input data-c="condiciones" value="' + E(DON.notaExtra(c)) + '" placeholder="Ej. Válido de lunes a viernes"></label>' +
      '<div class="valor">Valor para el reporte: <b data-valor>' + DON.dinero(valorCupon(c)) + '</b></div>' +
    '</div>';
    return h;
  }

  function pintarEditor(){
    var cuerpo =
      '<div class="seccion"><h3>¿Quién lo pide?</h3><div class="grid2">' +
        campo('Institución *', 'institucion', 'text', 'Esc. Primaria Benito Juárez') +
        campo('Evento (lo verá la institución)', 'evento', 'text', 'Kermés navideña, rifa, festival, graduación…') +
        campo('Contacto', 'contacto', 'text', 'Mtra. Ana López') +
        campo('Teléfono (WhatsApp)', 'telefono', 'tel', '983 123 4567') +
        campo('Fecha del evento', 'fecha_evento', 'date') +
        campo('Motivo', 'motivo', 'text', 'Recaudar fondos para…') +
      '</div>' +
      '<label class="campo"><span>Notas internas</span><textarea data-f="notas">' + E(ed.notas || '') + '</textarea></label></div>' +
      '<div class="seccion"><h3>Cupones (' + ed.cupones.length + ')</h3>' +
        '<div class="peq" style="margin-bottom:10px">Un cupón por cada regalo. Usa <b>+ Igual</b> para repetir el mismo premio.</div>' +
        '<details class="card" style="padding:10px 14px;margin-bottom:12px"><summary class="peq" style="cursor:pointer">Condiciones que salen en <b>todos</b> los cupones</summary>' +
          DON.normasHtml(null) + '</details>' +
        '<div id="lista-cup">' + ed.cupones.map(htmlCupon).join('') + '</div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
          '<button class="btn sec" id="add-prod">+ Cupón de productos</button>' +
          '<button class="btn sec" id="add-monto">+ Cupón de monto</button>' +
          '<button class="btn sec" id="por-dias">📅 Repetir para varios días</button>' +
        '</div></div>';
    var pie = '<span class="peq" id="total-ed" style="margin-right:auto;align-self:center"></span>' +
              '<button class="btn sec" data-cerrar2>Cancelar</button><button class="btn" id="guardar">Guardar</button>';
    var p = abrirPanel(ed.id ? 'Editar · ' + ed.institucion : 'Nueva solicitud', cuerpo, pie);
    totalEditor();
    p.querySelector('[data-cerrar2]').onclick = function(){ if (ed.id) abrirDetalle(ed.id); else cerrarPanel(); };
    p.querySelectorAll('[data-f]').forEach(function(inp){ inp.oninput = function(){ ed[inp.getAttribute('data-f')] = inp.value; }; });
    p.querySelector('[data-f=fecha_evento]').onchange = function(){
      ed.fecha_evento = this.value;
      ed.cupones.forEach(function(c){ if (!c.valido_desde) ajustarVence(c); });
      repintarLista();
    };
    $('add-prod').onclick = function(){ agregar('producto'); };
    $('add-monto').onclick = function(){ agregar('monto'); };
    $('por-dias').onclick = abrirPorDias;

  function agregar(tipo){
    var c = cuponVacio(ed.cupones.length + 1); c.tipo = tipo;
    ed.cupones.push(c);
    var cont = $('lista-cup'); cont.insertAdjacentHTML('beforeend', htmlCupon(c, ed.cupones.length - 1));
    conectarCupones(cont.lastElementChild.parentNode);
    actualizarTituloSeccion(); totalEditor();
    cont.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function actualizarTituloSeccion(){
    var h = $('lista-cup').parentNode.querySelector('h3'); if (h) h.textContent = 'Cupones (' + ed.cupones.length + ')';
  }
  function repintarCupon(i){
    var el = $('lista-cup').querySelector('.cup-ed[data-i="' + i + '"]');
    var tmp = document.createElement('div'); tmp.innerHTML = htmlCupon(ed.cupones[i], i);
    el.replaceWith(tmp.firstElementChild);
    conectarCupones($('lista-cup')); totalEditor();
  }
  function repintarLista(){
    $('lista-cup').innerHTML = ed.cupones.map(htmlCupon).join('');
    conectarCupones($('lista-cup')); actualizarTituloSeccion(); totalEditor();
  }
  function totalEditor(){
    var act = ed.cupones.filter(function(c){ return !c.cancelar; });
    var v = act.reduce(function(a, c){ return a + valorCupon(c); }, 0);
    var t = $('total-ed'); if (t) t.textContent = act.length + ' cupón(es) · ' + DON.dinero(v);
  }

  function conectarCupones(root){
    root.querySelectorAll('.cup-ed').forEach(function(el){
      if (el._ok) return; el._ok = true;
      var i = +el.getAttribute('data-i');
      var c = function(){ return ed.cupones[i]; };
      el.querySelectorAll('[data-c]').forEach(function(inp){
        var k = inp.getAttribute('data-c');
        if (k === 'valido_desde' || k === 'vence') {
          inp.onchange = function(){
            c()[k] = inp.value;
            if (k === 'vence') c()._auto = !inp.value;
            ajustarVence(c());
            repintarCupon(i);
          };
          return;
        }
        inp.oninput = function(){ c()[k] = inp.value; refrescarValor(el, i); };
      });
      el.querySelectorAll('[data-tipo]').forEach(function(b){
        b.onclick = function(){ c().tipo = b.getAttribute('data-tipo'); repintarCupon(i); };
      });
      var dup = el.querySelector('[data-dup]');
      if (dup) dup.onclick = function(){
        var n = cuponVacio(ed.cupones.length + 1, c());
        ed.cupones.splice(i + 1, 0, n); renumerarTitulos(); repintarLista();
      };
      var q = el.querySelector('[data-quitar]');
      if (q) q.onclick = function(){ ed.cupones.splice(i, 1); repintarLista(); };
      var cn = el.querySelector('[data-cancelar]');
      if (cn) cn.onclick = function(){ c().cancelar = !c().cancelar; repintarCupon(i); };
      el.querySelectorAll('.it').forEach(function(row){
        var j = +row.getAttribute('data-j');
        row.querySelectorAll('[data-it]').forEach(function(inp){
          inp.oninput = function(){ c().items[j][inp.getAttribute('data-it')] = inp.type === 'number' ? inp.value : inp.value; refrescarValor(el, i); };
        });
        row.querySelector('[data-qit]').onclick = function(){ c().items.splice(j, 1); repintarCupon(i); };
      });
      var bus = el.querySelector('[data-buscar]');
      if (bus) conectarBuscador(bus, el.querySelector('.sug'), function(prod){
        if (prod.combo) { bus.value = ''; el.querySelector('.sug').hidden = true; abrirArmador(el, i, prod); return; }
        c().items.push({ nombre: prod.nombre, cant: 1, precio: prod.precio });
        repintarCupon(i);
        var nuevo = $('lista-cup').querySelector('.cup-ed[data-i="' + i + '"] [data-buscar]'); if (nuevo) nuevo.focus();
      });
    });
  }
  // ── Evento de varios días: copia los premios de un día para cada día ──
  var RE_DIA = /^Día \d+ \([^)]*\) · /;
  var DIAS_SEM = ['dom','lun','mar','mié','jue','vie','sáb'];
  function etiquetaDia(n, iso){
    var d = new Date(iso + 'T12:00:00');
    return 'Día ' + n + ' (' + DIAS_SEM[d.getDay()] + ' ' + d.getDate() + ' ' + ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][d.getMonth()] + ')';
  }
  function abrirPorDias(){
    var viejo = $('panel-dias'); if (viejo) { viejo.remove(); return; }
    var paquete = ed.cupones.filter(function(c){ return c.estado !== 'canjeado' && !c.cancelar && !RE_DIA.test(c.titulo); });
    var cont = $('por-dias').parentNode;
    if (!paquete.length) {
      DON.toast('Primero arma los premios de UN día (los que aún no tienen "Día N")', true); return;
    }
    cont.insertAdjacentHTML('afterend',
      '<div class="card" id="panel-dias" style="padding:14px;margin-top:12px;background:var(--bg)">' +
        '<b>📅 Evento de varios días</b>' +
        '<p class="peq" style="margin:6px 0 10px">Los <b>' + paquete.length + '</b> premio(s) que tienes ahora se toman como el paquete de <b>un día</b> ' +
          'y se copian para cada día. Cada cupón queda marcado con su día (ej. "Día 2 (sáb 6 dic) · Premio 1") ' +
          'y <b>no se puede canjear antes de su día</b>.</p>' +
        '<div class="grid2">' +
          '<label class="campo"><span>Primer día del evento</span><input type="date" id="dias-ini" value="' + E(ed.fecha_evento || DON.hoyISO()) + '"></label>' +
          '<label class="campo"><span>¿Cuántos días?</span><input type="number" id="dias-n" min="2" max="31" value="3" inputmode="numeric"></label>' +
        '</div>' +
        '<div class="peq" id="dias-prev" style="margin-bottom:10px"></div>' +
        '<button class="btn chico" id="dias-ok">Generar cupones por día</button> ' +
        '<button class="btn chico sec" id="dias-x">Cancelar</button>' +
      '</div>');
    function prev(){
      var n = Math.min(31, Math.max(2, parseInt($('dias-n').value, 10) || 2));
      $('dias-prev').innerHTML = 'Se generarán <b>' + (paquete.length * n) + '</b> cupones en total (' + paquete.length + ' × ' + n + ' días).';
    }
    $('dias-n').oninput = prev; prev();
    $('dias-x').onclick = function(){ $('panel-dias').remove(); };
    $('dias-ok').onclick = function(){
      var ini = $('dias-ini').value;
      var n = Math.min(31, Math.max(2, parseInt($('dias-n').value, 10) || 2));
      if (!ini) { DON.toast('Elige el primer día', true); return; }
      var otros = ed.cupones.filter(function(c){ return paquete.indexOf(c) === -1; });
      var nuevos = [];
      for (var d = 0; d < n; d++) {
        var f = new Date(ini + 'T12:00:00'); f.setDate(f.getDate() + d);
        var iso = f.getFullYear() + '-' + String(f.getMonth() + 1).padStart(2, '0') + '-' + String(f.getDate()).padStart(2, '0');
        var pref = etiquetaDia(d + 1, iso) + ' · ';
        paquete.forEach(function(c){
          var base = d === 0 ? c : JSON.parse(JSON.stringify(c));
          if (d > 0) { delete base.id; delete base.folio; delete base.estado; delete base.vencido; delete base.ganador_nombre; }
          base.titulo = pref + c.titulo.replace(RE_DIA, '');
          base.valido_desde = iso;   // el cupón del Día N no se puede canjear antes de ese día
          base.vence = sumarDias(iso, 1); base._auto = true;
          nuevos.push(base);
        });
      }
      ed.cupones = otros.concat(nuevos);
      if (!ed.fecha_evento) ed.fecha_evento = ini;
      $('panel-dias').remove();
      repintarLista();
      DON.toast(nuevos.length + ' cupones listos. Revisa y dale Guardar.');
    };
  }

  // ── Armador de combos (pasta, latte, frappé…) ──
  // Cada paso se puede fijar o dejar "a elección de quien lo recibe".
  // Valor: suma de lo elegido; en los pasos a elección se toma la opción más cara (valor máximo posible).
  function armarCombo(prod, sel){
    var c = prod.combo, partes = [], precio = 0, todoElegir = true;
    c.groups.forEach(function(g, gi){
      var v = sel[gi];
      if (v === A_ELEGIR) {
        precio += Math.max.apply(null, g.options.map(function(o){ return Number(o.p) || 0; }));
        partes.push(g.label.toLowerCase() + ' a elegir');
      } else {
        var o = g.options[+v]; todoElegir = false;
        precio += Number(o.p) || 0;
        if (!o.none) partes.push(o.n);
      }
    });
    var nombre = todoElegir ? prod.nombre + ' (a elegir)' : partes.length ? prod.nombre + ': ' + partes.join(', ') : prod.nombre + ' sencillo';
    return { nombre: nombre, precio: precio };
  }
  function abrirArmador(el, i, prod){
    var viejo = el.querySelector('.armador'); if (viejo) viejo.remove();
    var c = prod.combo;
    var h = '<div class="armador card" style="padding:12px;margin-top:8px;background:var(--bg)">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>🧩 Armar: ' + E(prod.nombre) + '</b>' +
      '<button class="btn chico sec" data-arm-x>×</button></div><div class="grid2">' +
      c.groups.map(function(g, gi){
        var tieneNinguno = g.options.some(function(o){ return o.none; });
        return '<label class="campo"><span>' + E(g.label) + '</span><select data-g="' + gi + '">' +
          '<option value="' + A_ELEGIR + '"' + (tieneNinguno ? '' : ' selected') + '>— A elección de quien lo recibe —</option>' +
          g.options.map(function(o, oi){
            return '<option value="' + oi + '"' + (tieneNinguno && o.none ? ' selected' : '') + '>' + E(o.n) + (o.p ? ' · ' + DON.dinero(o.p) : '') + '</option>';
          }).join('') + '</select></label>';
      }).join('') +
      '<label class="campo"><span>Cantidad</span><input data-arm-cant type="number" min="1" value="1" inputmode="numeric"></label>' +
      '</div><div class="peq" data-arm-prev style="margin-bottom:8px"></div>' +
      '<button class="btn chico" data-arm-ok>Agregar al cupón</button></div>';
    el.querySelector('.buscador').insertAdjacentHTML('afterend', h);
    var arm = el.querySelector('.armador');
    function sel(){ return Array.prototype.map.call(arm.querySelectorAll('[data-g]'), function(s){ return s.value; }); }
    function prev(){ var r = armarCombo(prod, sel()); arm.querySelector('[data-arm-prev]').innerHTML = 'Quedará: <b>' + E(r.nombre) + '</b> · ' + DON.dinero(r.precio) + ' c/u'; }
    arm.querySelectorAll('select').forEach(function(s){ s.onchange = prev; });
    prev();
    arm.querySelector('[data-arm-x]').onclick = function(){ arm.remove(); };
    arm.querySelector('[data-arm-ok]').onclick = function(){
      var r = armarCombo(prod, sel());
      var n = Math.max(1, parseInt(arm.querySelector('[data-arm-cant]').value, 10) || 1);
      ed.cupones[i].items.push({ nombre: r.nombre, cant: n, precio: r.precio });
      repintarCupon(i);
    };
    arm.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // Si el título sigue siendo "Premio N" automático, lo renumera
  function renumerarTitulos(){
    ed.cupones.forEach(function(c, k){ if (!c.folio && /^Premio \d+$/.test(c.titulo)) c.titulo = 'Premio ' + (k + 1); });
  }
  function refrescarValor(el, i){
    var v = el.querySelector('[data-valor]'); if (v) v.textContent = DON.dinero(valorCupon(ed.cupones[i]));
    totalEditor();
  }

  function conectarBuscador(inp, sug, alElegir){
    var res = [], sel = 0;
    function render(){
      var t = quitarAcentos(inp.value.trim());
      if (!t) { sug.hidden = true; return; }
      var partes = t.split(/\s+/);
      res = CATALOGO.filter(function(p){ return partes.every(function(w){ return p.k.indexOf(w) !== -1; }); }).slice(0, 12);
      var libre = { nombre: inp.value.trim(), precio: 0, libre: true };
      res.push(libre);
      sel = 0;
      sug.innerHTML = res.map(function(p, k){
        return '<div data-k="' + k + '" class="' + (k === sel ? 'sel' : '') + '">' +
          (p.libre ? '<span>Agregar “' + E(p.nombre) + '” (otro)</span><small>precio a mano</small>'
           : p.combo ? '<span>🧩 ' + E(p.nombre) + ' <small>· armar</small></span><small>desde ' + DON.dinero(p.precio) + '</small>'
                   : '<span>' + E(p.nombre) + ' <small>· ' + E(p.cat) + '</small></span><small>' + DON.dinero(p.precio) + '</small>') + '</div>';
      }).join('');
      sug.hidden = false;
    }
    inp.oninput = render;
    inp.onkeydown = function(e){
      if (sug.hidden) return;
      if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, res.length - 1); marcar(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); marcar(); e.preventDefault(); }
      else if (e.key === 'Enter') { e.preventDefault(); if (res[sel]) alElegir(res[sel]); }
      else if (e.key === 'Escape') { sug.hidden = true; }
    };
    function marcar(){ sug.querySelectorAll('[data-k]').forEach(function(d){ d.classList.toggle('sel', +d.getAttribute('data-k') === sel); }); }
    sug.onmousedown = function(e){ var d = e.target.closest('[data-k]'); if (d) { e.preventDefault(); alElegir(res[+d.getAttribute('data-k')]); } };
    inp.onblur = function(){ setTimeout(function(){ sug.hidden = true; }, 150); };
  }

  async function guardar(){
    if (!String(ed.institucion || '').trim()) { DON.toast('Falta el nombre de la institución', true); return; }
    var payload = {
      id: ed.id || null, institucion: ed.institucion, contacto: ed.contacto, telefono: ed.telefono,
      motivo: ed.motivo, evento: ed.evento, fecha_evento: ed.fecha_evento || null, notas: ed.notas,
      cupones: ed.cupones.map(function(c){
        return { id: c.id || null, tipo: c.tipo, titulo: c.titulo, cancelar: !!c.cancelar,
                 items: (c.items || []).filter(function(i){ return String(i.nombre || '').trim(); })
                          .map(function(i){ return { nombre: String(i.nombre).trim(), cant: Math.max(1, parseInt(i.cant, 10) || 1), precio: Number(i.precio) || 0 }; }),
                 monto: c.tipo === 'monto' ? (Number(c.monto) || null) : null,
                 condiciones: c.condiciones || null, vence: c.vence || null, valido_desde: c.valido_desde || null };
      })
    };
    for (var k = 0; k < payload.cupones.length; k++) {
      var c = payload.cupones[k], orig = ed.cupones[k];
      if (orig.estado === 'canjeado') continue;
      if (!String(c.titulo || '').trim()) { DON.toast('El cupón ' + (k + 1) + ' no tiene nombre', true); return; }
      if (c.tipo === 'monto' && !(c.monto > 0)) { DON.toast('"' + c.titulo + '": falta el monto', true); return; }
      var mv = minVence(orig);
      if (c.vence && mv && c.vence < mv) { DON.toast('"' + c.titulo + '": "Válido hasta" no puede ser antes del ' + DON.fechaCorta(mv), true); return; }
      if (c.tipo === 'producto' && !c.items.length) { DON.toast('"' + c.titulo + '": agrega al menos un producto', true); return; }
    }
    var b = $('guardar'); b.disabled = true; b.textContent = 'Guardando…';
    try {
      var r = await llamar('don_guardar_solicitud', { p: payload });
      await recargar();
      DON.toast('Guardado');
      abrirDetalle(r.id);
    } catch (e) {
      DON.toast(DON.textoError(e), true);
      b.disabled = false; b.textContent = 'Guardar';
    }
  }

  // ═════════ REPORTE ═════════
  function cuponesPlano(){
    var out = [];
    lista.forEach(function(s){ (s.cupones || []).forEach(function(c){ out.push({ s: s, c: c }); }); });
    return out;
  }
  function anioMes(ts){ var d = new Date(ts); var l = new Date(d.toLocaleString('en-US', { timeZone: 'America/Cancun' })); return [l.getFullYear(), l.getMonth()]; }

  function pintarReporte(){
    var todos = cuponesPlano().filter(function(x){ return x.c.estado !== 'cancelado'; });
    var anios = {}; anios[new Date().getFullYear()] = 1;
    todos.forEach(function(x){ anios[anioMes(x.s.creado)[0]] = 1; if (x.c.canjeado_en) anios[anioMes(x.c.canjeado_en)[0]] = 1; });
    var listaAnios = Object.keys(anios).sort().reverse();
    if (listaAnios.indexOf(anioRep) === -1) anioRep = listaAnios[0];
    var A = +anioRep;

    var meses = []; for (var m = 0; m < 12; m++) meses.push({ don: 0, vdon: 0, canj: 0, vcanj: 0 });
    var porInst = {}, ganadores = [];
    todos.forEach(function(x){
      var am = anioMes(x.s.creado), v = Number(x.c.valor) || 0;
      if (am[0] === A) {
        meses[am[1]].don++; meses[am[1]].vdon += v;
        var k = x.s.institucion;
        porInst[k] = porInst[k] || { n: 0, v: 0, cj: 0, vcj: 0, sol: {} };
        porInst[k].n++; porInst[k].v += v; porInst[k].sol[x.s.id] = 1;
        if (x.c.estado === 'canjeado') { porInst[k].cj++; porInst[k].vcj += v; }
      }
      if (x.c.estado === 'canjeado' && x.c.canjeado_en) {
        var ac = anioMes(x.c.canjeado_en);
        if (ac[0] === A) { meses[ac[1]].canj++; meses[ac[1]].vcanj += v; ganadores.push(x); }
      }
    });
    var T = meses.reduce(function(a, x){ a.don += x.don; a.vdon += x.vdon; a.canj += x.canj; a.vcanj += x.vcanj; return a; }, { don: 0, vdon: 0, canj: 0, vcanj: 0 });
    var MES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    ganadores.sort(function(a, b){ return new Date(b.c.canjeado_en) - new Date(a.c.canjeado_en); });
    var insts = Object.keys(porInst).sort(function(a, b){ return porInst[b].v - porInst[a].v; });

    var h = '<div class="toolbar"><select id="anio">' + listaAnios.map(function(a){ return '<option' + (a === anioRep ? ' selected' : '') + '>' + a + '</option>'; }).join('') + '</select>' +
      '<button class="btn sec" id="csv">⬇︎ Exportar CSV</button></div>' +
      '<div class="kpis">' + kpi(T.don, 'Cupones donados') + kpi(DON.dinero(T.vdon), 'Valor donado') + kpi(T.canj, 'Canjeados') + kpi(DON.dinero(T.vcanj), 'Valor canjeado') +
        kpi((T.don ? Math.round(T.canj / T.don * 100) : 0) + '%', 'Tasa de canje') + kpi(insts.length, 'Instituciones') + '</div>' +
      '<div class="seccion"><h3>Por mes · ' + A + '</h3><div class="card tabla"><table class="t">' +
        '<tr><th>Mes</th><th class="num">Donados</th><th class="num">Valor donado</th><th class="num">Canjeados</th><th class="num">Valor canjeado</th></tr>' +
        meses.map(function(x, i){ return (x.don || x.canj) ? '<tr><td>' + MES[i] + '</td><td class="num">' + x.don + '</td><td class="num">' + DON.dinero(x.vdon) + '</td><td class="num">' + x.canj + '</td><td class="num">' + DON.dinero(x.vcanj) + '</td></tr>' : ''; }).join('') +
        '<tr class="total"><td>Total</td><td class="num">' + T.don + '</td><td class="num">' + DON.dinero(T.vdon) + '</td><td class="num">' + T.canj + '</td><td class="num">' + DON.dinero(T.vcanj) + '</td></tr>' +
      '</table></div><div class="peq" style="margin-top:6px">Donados: por fecha de registro de la solicitud. Canjeados: por fecha en que se canjearon.</div></div>' +
      '<div class="seccion"><h3>Por institución · ' + A + '</h3><div class="card tabla"><table class="t">' +
        '<tr><th>Institución</th><th class="num">Solicitudes</th><th class="num">Cupones</th><th class="num">Valor</th><th class="num">Canjeados</th></tr>' +
        (insts.length ? insts.map(function(k){ var x = porInst[k]; return '<tr><td>' + E(k) + '</td><td class="num">' + Object.keys(x.sol).length + '</td><td class="num">' + x.n + '</td><td class="num">' + DON.dinero(x.v) + '</td><td class="num">' + x.cj + ' (' + DON.dinero(x.vcj) + ')</td></tr>'; }).join('')
                      : '<tr><td colspan="5" class="peq">Sin donativos este año.</td></tr>') +
      '</table></div></div>' +
      '<div class="seccion"><h3>Beneficiarios que canjearon · ' + A + '</h3><div class="card tabla"><table class="t">' +
        '<tr><th>Fecha</th><th>Beneficiario</th><th>Teléfono</th><th>Folio</th><th>Institución</th><th class="num">Valor</th></tr>' +
        (ganadores.length ? ganadores.map(function(x){
          return '<tr><td class="peq">' + E(DON.fechaHora(x.c.canjeado_en)) + '</td><td>' + E(x.c.ganador_nombre || '') + '</td>' +
            '<td>' + (x.c.ganador_tel ? '<a target="_blank" href="' + E(DON.waLink(x.c.ganador_tel, '')) + '">' + E(x.c.ganador_tel) + '</a>' : '') + '</td>' +
            '<td class="folio">' + E(x.c.folio) + '</td><td>' + E(x.s.institucion) + '</td><td class="num">' + DON.dinero(x.c.valor) + '</td></tr>';
        }).join('') : '<tr><td colspan="6" class="peq">Aún no hay canjes este año.</td></tr>') +
      '</table></div></div>';
    $('vista').innerHTML = h;
    $('anio').onchange = function(){ anioRep = this.value; pintarReporte(); };
    $('csv').onclick = exportarCSV;
  }

  function exportarCSV(){
    var filas = [['Folio','Institución','Evento','Fecha solicitud','Premio','Tipo','Incluye','Valor','Vence','Estado','Canjeado el','Beneficiario','Teléfono beneficiario','Notas canje']];
    cuponesPlano().forEach(function(x){
      var c = x.c, s = x.s;
      filas.push([c.folio, s.institucion, s.evento || '', String(s.creado).slice(0, 10), c.titulo, c.tipo,
        DON.lineasCupon(c).join(' | '), c.valor, c.vence || '', DON.estadoCupon(c).texto,
        c.canjeado_en ? DON.fechaHora(c.canjeado_en) : '', c.ganador_nombre || '', c.ganador_tel || '', c.canje_notas || '']);
    });
    var csv = '﻿' + filas.map(function(f){ return f.map(function(v){ v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'donativos-mozzafiato-' + DON.hoyISO() + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }

  // ═════════ CAJA ═════════
  async function pintarCaja(){
    var link = DON.urlCaja();
    $('vista').innerHTML = '<div class="cargando">Cargando…</div>';
    var hay = false;
    try { hay = await llamar('don_hay_pin_caja', {}); } catch (e) { DON.toast(DON.textoError(e), true); }
    $('vista').innerHTML =
      '<div class="grid2" style="gap:16px">' +
      '<div class="card" style="padding:18px">' +
        '<h3 style="margin-bottom:6px">PIN de caja</h3>' +
        '<p class="peq" style="margin-top:0">' + (hay ? '✅ Ya hay un PIN definido. Si lo cambias, los equipos de caja tendrán que escribir el nuevo.' : '⚠️ Aún no hay PIN: la caja no podrá validar hasta que lo definas.') + '</p>' +
        '<label class="campo"><span>' + (hay ? 'Nuevo PIN' : 'PIN') + ' (mínimo 4 dígitos)</span><input id="nuevo-pin" type="password" inputmode="numeric" autocomplete="new-password" maxlength="12"></label>' +
        '<button class="btn" id="guardar-pin">' + (hay ? 'Cambiar PIN' : 'Guardar PIN') + '</button>' +
      '</div>' +
      '<div class="card" style="padding:18px;text-align:center">' +
        '<h3 style="margin-bottom:6px">Pantalla de caja</h3>' +
        '<p class="peq" style="margin-top:0">Abre este link en la tablet o PC de caja (escanea el QR) y escribe el PIN una vez: queda recordado en ese equipo.</p>' +
        '<div class="qrcaja">' + DON.qrSvg(link) + '</div>' +
        '<code class="peq" style="word-break:break-all">' + E(link) + '</code>' +
        '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px">' +
          '<button class="btn sec chico" id="copiar-caja">Copiar link</button>' +
          '<a class="btn sec chico" target="_blank" href="' + E(link) + '">Abrir caja</a>' +
        '</div>' +
      '</div></div>';
    $('copiar-caja').onclick = function(){ DON.copiar(link); };
    $('guardar-pin').onclick = async function(){
      var v = $('nuevo-pin').value.trim();
      if (!/^\d{4,12}$/.test(v)) { DON.toast('El PIN debe ser de 4 a 12 números', true); return; }
      try { await llamar('don_set_pin_caja', { p_pin: v }); DON.toast('PIN de caja guardado'); pintarCaja(); }
      catch (e) { DON.toast(DON.textoError(e), true); }
    };
  }

  // ═════════ Arranque ═════════
  DON.pintarLogos();
  (async function(){
    if (DON.getSesion() && await DON.tokenVigente()) {
      try { await validarAdmin(); return; } catch (e) { mostrarGate(DON.textoError(e)); return; }
    }
    mostrarGate();
  })();
})();
</script>
